# ============================================================
# 生产环境差异层（入库）。凭据一律不写在这里。
#
# 部署时把真实连接串放到 config/production.local.yaml（不入库，由 bind mount
# 或 compose secrets 挂载），或直接覆盖挂载整份文件。
# ============================================================

app:
  port: 80

database:
  pool:
    # 生产建议按「实例数 × max < PG max_connections」计算，并配合 PgBouncer 之类的中间件
    max: 20
    idle-timeout: 30000
    connect-timeout: 5000
  # 生产环境禁止打印 SQL
  log-queries: false
  url: postgresql://root:123456@localhost:5432/nest-admin?schema=public

redis:
  # 与开发环境隔离；凭据通过 production.local.yaml 挂载
  key-prefix: nest-admin:production

logger:
  console:
    # 生产环境默认使用 JSON，便于日志平台采集；可覆盖为 true 开启彩色
    pretty: false

swagger:
  # 生产环境默认关闭文档，可在 production.local.yaml 中覆盖
  enabled: false
